<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 350px;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .lang {
            font-size: 12px;
            color: #a8a8a8;
            margin-bottom: 30px;
            cursor: pointer;
        }
        .logo {
            font-size: 38px;
            font-weight: bold;
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background-color: #121212;
            border: 1px solid #363636;
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #a8a8a8;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #0095f6;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;
        }
        .forgot {
            font-size: 12px;
            color: #e0e0e0;
            margin-top: 20px;
            display: block;
            text-decoration: none;
        }
        .btn-create {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            border: 1px solid #dbdbdb;
            border-radius: 5px;
            color: #0095f6;
            font-weight: bold;
            font-size: 14px;
            margin-top: 70px;
            cursor: pointer;
        }
        .meta {
            font-size: 12px;
            color: #737373;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang">English (US) ˅</div>
        <div class="logo">Instagram</div>
        <form>
            <input type="text" placeholder="Username, email or mobile number">
            <input type="password" placeholder="Password">
            <button type="submit" class="btn-login">Log in</button>
        </form>
        <a href="#" class="forgot">Forgot password?</a>
        <button class="btn-create">Create new account</button>
        <div class="meta">∞ Meta</div>
    </div>
</body>
</html>
